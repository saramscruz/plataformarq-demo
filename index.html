function cls(s){return s.includes('Concluído')?'done':s.includes('Suspenso')?'paused':s.includes('Pendente')?'warn':s.includes('espera')?'wait':'ok'}function av(id){let p=people[id]||[id,'#777'];return `<span class='avatar' style='background:${p[1]}' title='${p[0]}'>${id}</span>`}function group(k){return projects.reduce((a,p)=>((a[p[k]]=(a[p[k]]||0)+1),a),{})}
function render(){let q=$('#q').value.toLowerCase().trim(),list=projects.filter(p=>(!fs||p.status==fs)&&(!fc||p.coord==fc));if(q)list=list.filter(p=>Object.values(p).flat().join(' ').toLowerCase().includes(q));if(tab=='prioridade')list.sort((a,b)=>['Urgente','Alta','Normal','Baixa'].indexOf(a.prio)-['Urgente','Alta','Normal','Baixa'].indexOf(b.prio));if(tab=='coordenador')list.sort((a,b)=>a.coord.localeCompare(b.coord));if(tab=='status')list.sort((a,b)=>a.status.localeCompare(b.status));$('#rows').innerHTML=list.map(p=>`<tr data-n='${p.num}'><td class='num'>${p.num}</td><td><div class='project'>${p.nome}</div><div class='year'>${p.ano}</div></td><td class='hide'>${p.cliente}</td><td>${p.local}</td><td>${p.fase}</td><td><span class='tag ${cls(p.status)}'>${p.status}</span></td><td><span class='prio ${p.prio}'>${p.prio}</span></td><td>${av(p.coord)}</td><td class='hide'>${p.colab.map(av).join('')}</td><td>${p.cam}</td></tr>`).join('');$('#count').textContent=list.length+' projetos';metrics();$$('tbody tr').forEach(r=>r.onclick=()=>open(r.dataset.n))}
function metrics(){let due=projects.filter(p=>new Date(p.prazo)<=new Date('2026-06-27')).length;$('#total').textContent=projects.length;$('#due').textContent=due;$('#m1').textContent=projects.filter(p=>p.status.startsWith('Ativo')).length;$('#m2').textContent=due;$('#m3').textContent=projects.filter(p=>p.status.startsWith('Pendente')).length;$('#m4').textContent=new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(projects.reduce((s,p)=>s+p.valor,0))}
function filters(){let s=group('status'),c=group('coord');$('#status').innerHTML=Object.keys(s).map(x=>`<button class='filter' data-s='${x}'><span>${x}</span><span class='pill'>${s[x]}</span></button>`).join('');$('#coord').innerHTML=Object.keys(c).map(x=>`<button class='filter' data-c='${x}'>${av(x)}<span>${people[x][0]}</span><span class='pill'>${c[x]}</span></button>`).join('');$$('[data-s]').forEach(b=>b.onclick=()=>{fs=fs==b.dataset.s?'':b.dataset.s;render();mark()});$$('[data-c]').forEach(b=>b.onclick=()=>{fc=fc==b.dataset.c?'':b.dataset.c;render();mark()})}
function mark(){$$('[data-s]').forEach(b=>b.classList.toggle('active',b.dataset.s==fs));$$('[data-c]').forEach(b=>b.classList.toggle('active',b.dataset.c==fc))}
function open(n){let p=projects.find(x=>x.num==n);$('#drawer').innerHTML=`<button class='x'>×</button><h2>${p.nome}</h2><p>${p.num} · ${p.cliente}</p><div class='grid'><div class='field'><div class='label'>Local</div><div class='value'>${p.local}</div></div><div class='field'><div class='label'>Prazo</div><div class='value'>${p.prazo}</div></div><div class='field'><div class='label'>Fase</div><div class='value'>${p.fase}</div></div><div class='field'><div class='label'>Valor Demo</div><div class='value'>${new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(p.valor)}</div></div></div><span class='tag ${cls(p.status)}'>${p.status}</span><div class='event'><b>Histórico demo</b><br>Comunicação simulada e próxima ação registada localmente.</div>`;$('#drawer').classList.add('open');$('.x').onclick=()=>$('#drawer').classList.remove('open')}
function toast(){let t=$('#toast');t.style.display='block';setTimeout(()=>t.style.display='none',2200)}$('#new').onclick=toast;$('#q').oninput=render;$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});filters();render();
</script>
</body>
</html>
