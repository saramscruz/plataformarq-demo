<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PLATAFORMArq Demo</title>
  <style>
    body{margin:0;background:#f5f4f0;color:#1a1814;font-family:Arial,sans-serif}
    .loading{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:12px}
    .dot{width:10px;height:10px;border-radius:50%;background:#b85c38;animation:pulse 1s infinite alternate}
    @keyframes pulse{to{opacity:.35;transform:scale(.8)}}
  </style>
</head>
<body>
  <div class="loading"><span class="dot"></span><span>A carregar PLATAFORMArq Demo...</span></div>
  <script>
    const files = ['payload/00.txt','payload/01.txt','payload/02.txt','payload/03.txt','payload/04.txt','payload/05.txt','payload/06.txt','payload/07.txt'];
    const logoFile = 'assets/plataformarq-logo.jpg.b64';
    async function text(path){
      const response = await fetch(path);
      if(!response.ok) throw new Error(path + ' ' + response.status);
      return response.text();
    }
    async function boot(){
      if(!('DecompressionStream' in window)){
        document.body.innerHTML = '<p style="padding:24px;font:16px Arial">Este browser nao suporta a demo comprimida. Abre a pagina num Chrome, Edge, Safari ou Firefox recente.</p>';
        return;
      }
      const [payloadParts, logo] = await Promise.all([
        Promise.all(files.map(text)),
        text(logoFile)
      ]);
      const binary = atob(payloadParts.join(''));
      const bytes = new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      let html = await new Response(stream).text();
      html = html.replaceAll('assets/plataformarq-logo.jpg', 'data:image/jpeg;base64,' + logo.trim());
      document.open();
      document.write(html);
      document.close();
    }
    boot().catch(err => {
      document.body.innerHTML = '<p style="padding:24px;font:16px Arial">Nao foi possivel carregar a demo: '+String(err.message || err)+'</p>';
    });
  </script>
</body>
</html>
